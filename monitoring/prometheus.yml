global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: payment-api-http
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: payment-api-business
    metrics_path: /metrics/business
    static_configs:
      - targets:
          - api:8000
